name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} / Yii 1.1 / ${{ matrix.dependencies }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [prefer-lowest, prefer-stable]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        id: php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: mbstring, dom, fileinfo, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ steps.php.outputs.php-version }}-${{ hashFiles('composer.json') }}

      - name: Install matrix dependencies
        run: |
          composer update --${{ matrix.dependencies }} --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit --no-coverage --order-by=random --random-order-seed=1788957854 --display-warnings --fail-on-warning --log-junit build/phpunit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-linux-php${{ matrix.php }}-yii1-${{ matrix.dependencies }}
          path: build/phpunit.xml
          if-no-files-found: warn

  windows:
    name: Windows / PHP ${{ matrix.php }} / Yii 1.1 / ${{ matrix.dependencies }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            dependencies: prefer-stable
          - php: '8.4'
            dependencies: prefer-lowest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        id: php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: mbstring, dom, fileinfo, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ steps.php.outputs.php-version }}-${{ hashFiles('composer.json') }}

      - name: Install matrix dependencies
        run: |
          composer update --${{ matrix.dependencies }} --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit --no-coverage --order-by=random --random-order-seed=1788957854 --display-warnings --fail-on-warning --log-junit build/phpunit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-windows-php${{ matrix.php }}-${{ matrix.dependencies }}
          path: build/phpunit.xml
          if-no-files-found: warn
